services:
  xray:
    image: ghcr.io/xtls/xray-core:26.6.27
    container_name: learn-xray
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    ports:
      - "${XRAY_PORT:-443}:443/tcp"
    volumes:
      - ./data/xray/config.json:/etc/xray/config.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/xray", "run", "-test", "-c", "/etc/xray/config.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  subscription:
    image: nginx:1.29.1-alpine
    container_name: learn-xray-subscription
    restart: unless-stopped
    ports:
      - "${SUBSCRIPTION_PORT:-8080}:80/tcp"
    volumes:
      - ./data/subscription:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      xray:
        condition: service_healthy
